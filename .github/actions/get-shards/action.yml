name: "Get number of shards"
description: "Get the number of nf-test shards for the current CI job"
inputs:
  max_shards:
    description: "Maximum number of shards allowed"
    required: true
  paths:
    description: "Component paths to test"
    required: false
  tags:
    description: "Tags to pass as argument for nf-test --tag parameter"
    required: false
outputs:
  shard:
    description: "Array of shard numbers"
    value: ${{ steps.shards.outputs.shard }}
  total_shards:
    description: "Total number of shards"
    value: ${{ steps.shards.outputs.total_shards }}
runs:
  using: "composite"
  steps:
    - name: Install nf-test
      uses: nf-core/setup-nf-test@v1
      with:
        version: ${{ env.NFT_VER }}
    - name: Get number of shards
      id: shards
      shell: bash
      run: |
        # Build the command incrementally so we can conditionally include --changed-since
        cmd=(nf-test test --profile +docker)

        if [ -n "${{ inputs.tags }}" ]; then
          cmd+=(--tag "${{ inputs.tags }}")
        fi

        # Include --changed-since only if HEAD^ exists (protect first-commit runs)
        if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
          cmd+=(--changed-since HEAD^)
        else
          echo "No previous commit found (first-commit); skipping --changed-since"
        fi

        # Add common flags
        cmd+=(--dry-run --ci)

        # Execute and capture output (preserve stdout/stderr)
        nftest_output="$("${cmd[@]}" 2>&1)" || {
          echo "nf-test command failed with exit code $?"
          echo "Full output:"
          echo "$nftest_output"
          exit 1
        }

        echo "nf-test dry-run output: $nftest_output"

        # Default values for shard and total_shards
        shard="[]"
        total_shards=0

        # Check for "No tests to execute" message
        if echo "$nftest_output" | grep -q 'No tests to execute'; then
          echo "No related tests found."
        else
          # Extract the number of related tests robustly using grep -oP (fallback-safe)
          number_of_shards=$(echo "$nftest_output" | grep -oP 'Executed \K[0-9]+' || true)
          if [[ -n "$number_of_shards" && "$number_of_shards" -gt 0 ]]; then
            shards_to_run=$(( number_of_shards < ${{ inputs.max_shards }} ? number_of_shards : ${{ inputs.max_shards }} ))
            shard=$(seq 1 "$shards_to_run" | jq -R . | jq -c -s .)
            total_shards="$shards_to_run"
          else
            echo "Unexpected output format or zero tests. Falling back to default shard values."
          fi
        fi

        # Write to GitHub Actions outputs
        echo "shard=$shard" >> $GITHUB_OUTPUT
        echo "total_shards=$total_shards" >> $GITHUB_OUTPUT

        # Debugging output
        echo "Final shard array: $shard"
        echo "Total number of shards: $total_shards"
